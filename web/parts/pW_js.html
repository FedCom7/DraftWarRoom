<style>
.wv .wv-sec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 8px}
.wv .wv-sec h3{margin:0 6px 0 0;font:700 18px/1 var(--display);letter-spacing:.04em}
.wv .wv-sec label{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--k-muted)}
.wv .chips{display:flex;gap:3px;flex-wrap:wrap}
.wv .chips button{padding:4px 9px;font-size:11.5px}
.wv .chartwrap [data-tt]{cursor:pointer}
.wv .mv{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,38%) 80px;gap:10px;align-items:center;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12.5px}
.wv .mv:hover,.wv .mv.on{background:var(--k-p2)}
.wv .mv .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wv .mv .who small{display:block;color:var(--k-muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.wv .mv .in{color:var(--k-ink);font-weight:600}
.wv .mv .in::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#F2D82E;margin-right:6px}
.wv .mv .out{color:var(--k-muted)}
.wv .mv .out::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#3CC7F5;margin:0 6px 0 2px}
.wv .mv .bar{height:10px;background:var(--k-p2);border-radius:5px;overflow:hidden}
.wv .mv .bar i{display:block;height:100%;background:#F2D82E;border-radius:0 4px 4px 0}
.wv .mv .v{text-align:right;font:600 12.5px var(--mono);font-variant-numeric:tabular-nums}
.wv .plan{display:flex;flex-wrap:wrap;gap:8px}
.wv .plan .st{flex:1 1 180px;background:var(--k-bg);border:1px solid var(--k-line);border-radius:8px;padding:8px 10px;font-size:12px}
.wv .plan .st b{color:var(--k-ink)}
.wv .plan .st .n{font:600 10px var(--mono);color:var(--k-muted);letter-spacing:.06em}
.wv .plan .st .g{font:700 15px var(--mono);color:var(--k-y)}
.wv .wv-read{margin:4px 0 0;padding-left:18px;font-size:12.5px;line-height:1.5}
.wv .wv-read li{margin-bottom:6px}
.wv .wv-tab th{cursor:pointer;white-space:nowrap}
.wv .wv-tab th.on{color:var(--k-y)}
.wv .wv-tab td{white-space:nowrap}
.wv .wv-tab .spk{display:inline-flex;gap:1px;align-items:flex-end;height:18px;vertical-align:middle;margin-left:6px}
.wv .wv-tab .spk i{display:block;width:4px;border-radius:1px 1px 0 0;background:#4A5866}
.wv .wv-tab .spk i.z{height:2px!important;background:transparent;border-bottom:1px dotted #4A5866}
.wv .wv-tab tr.mine .spk i{background:#3CC7F5}
.wv .wv-tab tr.free .spk i{background:#F2D82E}
.wv .sc .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media (max-width:640px){
  .wv .mv{grid-template-columns:minmax(0,1fr) 60px 72px;gap:6px}
  .wv .wv-sec label{width:100%}
  .wv .wv-sec input{flex:1}
}
</style>
<script>
(()=>{
'use strict';
const D=window.DWR,A=window.DWR2,M=window.DWR3;
const {TBY,MY,esc}=D;const {n0,n1,R,tip,svgEl}=A;
const {POOL,WEEK,injOf,adv,tm,teamRank,sos3,matchup,weekPts}=M;
const TOP=window.TOPINA;
const $=(s,r=document)=>r.querySelector(s);
const C_ME='#3CC7F5',C_FREE='#F2D82E',C_OTH='#4A5866',GRID='#1E2833',AX='#7C8996',INK='#B8C3CE';
const POSS=['QB','RB','WR','TE','K','DST'];
const OUT=['O','IR','SUS'];
const f2=v=>v==null?'—':v.toFixed(2);
const last=n=>n.split(' ').slice(-1)[0];
const attr=s=>esc(s).replace(/"/g,'&quot;');

/* ---------- tabellini: [sett, punti, avv, tgt, ric, ydRic, tdRic, corse, ydCorsa, tdCorsa,
   ydPass, tdPass, int, snap%, quota target%, tgt RZ, corse RZ, dentro le 10] ---------- */
const WK=()=>TOP.weekly||{};
const LAST=(()=>{let m=0;Object.values(WK()).forEach(r=>r.forEach(x=>{if(x[0]<WEEK&&x[0]>m)m=x[0]}));return m||WEEK-1})();
/* una riga a zero senza snap è una partita saltata, non una partita brutta */
const played=(p,r)=>p.pos==='DST'||r[13]!=null||(r[1]||0)!==0||(r[3]||0)>0||(r[7]||0)>0||(r[10]||0)>0;
/* totali di squadra per giornata: la coppia settimana+avversario identifica la squadra
   anche per chi ha cambiato maglia a stagione in corso */
const TEAMTOT=(()=>{const t={};Object.values(WK()).forEach(rows=>rows.forEach(r=>{
  const k=r[0]+'|'+r[2],o=t[k]||(t[k]={tgt:0,car:0});o.tgt+=r[3]||0;o.car+=r[7]||0}));return t})();
const tshOf=r=>{if(r[14]!=null)return r[14];const t=TEAMTOT[r[0]+'|'+r[2]];return t&&t.tgt?(r[3]||0)/t.tgt*100:null};
const rshOf=r=>{const t=TEAMTOT[r[0]+'|'+r[2]];return t&&t.car?(r[7]||0)/t.car*100:null};
const q=(arr,p)=>{if(!arr.length)return null;const a=[...arr].sort((x,y)=>x-y),i=(a.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return a[lo]+(a[hi]-a[lo])*(i-lo)};
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;

const SUMC=new Map();
function summary(p,N){
  const k=p.id+'|'+N;if(SUMC.has(k))return SUMC.get(k);
  const rows=(WK()[String(p.id)]||[]).filter(r=>r[0]<=LAST&&r[0]>LAST-N&&played(p,r));
  const g=rows.length,per=f=>g?rows.reduce((s,r)=>s+(f(r)||0),0)/g:null;
  const pts=rows.map(r=>r[1]||0);
  const ts=rows.map(tshOf).filter(v=>v!=null),sn=rows.map(r=>r[13]).filter(v=>v!=null),rs=rows.map(rshOf).filter(v=>v!=null);
  const o={g,ppg:avg(pts),pts,
    tgt:per(r=>r[3]),rec:per(r=>r[4]),car:per(r=>r[7]),opp:per(r=>(r[3]||0)+(r[7]||0)),
    tsh:avg(ts),rsh:avg(rs),snap:avg(sn),rz:per(r=>(r[15]||0)+(r[16]||0)),
    yds:per(r=>(r[5]||0)+(r[8]||0)+(r[10]||0)),pyd:per(r=>r[10]),
    td:rows.reduce((s,r)=>s+(r[6]||0)+(r[9]||0)+(r[11]||0),0),
    floor:q(pts,0.2),ceil:q(pts,0.8)};
  SUMC.set(k,o);return o;
}
/* punti di ogni giornata, null se non ha giocato (per sparkline e grafici) */
function series(p,f){
  const by={};(WK()[String(p.id)]||[]).forEach(r=>{if(r[0]<=LAST)by[r[0]]=played(p,r)?f(r):null});
  const out=[];for(let w=1;w<=LAST;w++)out.push(w in by?by[w]:null);return out;
}

/* ---------- valore atteso di una giornata ---------- */
const PW=(p,w)=>{const r=(TOP.projWeeks||{})[String(p.id)];const v=r?r[String(w)]:null;return v==null?null:v};
const EVC=new Map();
function EV(p,w){
  const k=p.id+'|'+w;if(EVC.has(k))return EVC.get(k);
  let v;const f=summary(p,5),form=f.g>=2?f.ppg:null,pw=PW(p,w);
  if(p.bye===w)v=0;
  else if(pw!=null)v=pw<=0?0:(form!=null?0.65*pw+0.35*form:pw);
  else if(OUT.includes(p.inj))v=0;
  else{const b=weekPts(p,w);v=form!=null?0.6*b+0.4*form:b}
  EVC.set(k,v);return v;
}
let H=4,WIN=5,BASIS='ev';
const weeks=()=>{const o=[];for(let w=WEEK;w<WEEK+H&&w<=18;w++)o.push(w);return o};
const evH=p=>avg(weeks().map(w=>EV(p,w)))||0;

/* ---------- le partite giocate: stessa simulazione, rifatta sulle giornate passate ----------
   Ogni giornata della finestra "Forma" usa i punti veri. Una partita saltata (infortunio, bye)
   vale la media a gara della stagione: si misura il rendimento, non le assenze, e una sola
   partita giocata nella finestra non diventa la media di tutte. */
const pastWeeks=()=>{const o=[];for(let w=Math.max(1,LAST-Math.min(WIN,LAST)+1);w<=LAST;w++)o.push(w);return o};
const BYW=new Map();
const rowAt=(p,w)=>{let m=BYW.get(p.id);if(!m){m={};(WK()[String(p.id)]||[]).forEach(r=>{m[r[0]]=r});BYW.set(p.id,m)}return m[w]};
const ppgW=p=>summary(p,WIN).ppg;
function ACT(p,w){const r=rowAt(p,w);return r&&played(p,r)?(r[1]||0):(summary(p,99).ppg||0)}
const actH=p=>avg(pastWeeks().map(w=>ACT(p,w)))||0;
const VAL={
  ev:{f:EV,w:weeks,h:evH},
  past:{f:ACT,w:pastWeeks,h:actH}
};
const OTHER=()=>BASIS==='ev'?'past':'ev';
const V=(p,w)=>VAL[BASIS].f(p,w);
const wks=()=>VAL[BASIS].w();
const valH=p=>VAL[BASIS].h(p);
const winTxt=()=>WIN>=LAST?'della stagione':`delle ultime ${pastWeeks().length} giornate`;
/* "attesi" o "giocati", con il periodo */
const bTxt=(b=BASIS)=>b==='ev'?`attesi nelle prossime ${weeks().length}`:`giocati ${winTxt()}`;
const bShort=(b=BASIS)=>b==='ev'?'attesi':'giocati';

/* ---------- formazione migliore: prima i posti fissi, poi il flex RB/WR ---------- */
const FIX=[['QB',1],['RB',2],['WR',2],['TE',1],['DST',1],['K',1]];
function lineup(roster,w,vf=V){
  const by={};roster.forEach(p=>{(by[p.pos]=by[p.pos]||[]).push({p,v:vf(p,w)})});
  Object.values(by).forEach(a=>a.sort((x,y)=>y.v-x.v));
  let tot=0;const st=new Set();
  FIX.forEach(([pos,n])=>{(by[pos]||[]).splice(0,n).forEach(x=>{tot+=x.v;st.add(x.p.id)})});
  const r=(by.RB||[])[0],wr=(by.WR||[])[0],fx=!r?wr:!wr?r:(r.v>=wr.v?r:wr);
  if(fx){tot+=fx.v;st.add(fx.p.id)}
  return{tot,st};
}
const lineupTot=(roster,b=BASIS)=>VAL[b].w().reduce((s,w)=>s+lineup(roster,w,VAL[b].f).tot,0);
/* i titolari di oggi secondo la base scelta */
const starters=ros=>BASIS==='ev'?lineup(ros,WEEK,EV).st:lineup(ros,0,p=>valH(p)).st;
/* guadagno di una sostituzione sull'altra base, per metterlo accanto */
function altGain(roster,c,d){const b=OTHER(),n=VAL[b].w().length||1;
  return(lineupTot(roster.filter(x=>x.id!==d.id).concat(c),b)-lineupTot(roster,b))/n}

const mine=()=>POOL.filter(p=>p.own===MY);
const free=()=>POOL.filter(p=>!p.own);
/* la mossa migliore per ogni libero: si prova a togliere ognuno dei tuoi */
function movesFor(roster,cands){
  const base=lineupTot(roster),n=wks().length||1;
  const drops=roster.filter(p=>p.inj!=='IR');
  const out=[],NEED={QB:1,RB:3,WR:3,TE:1,K:1,DST:1};
  /* un libero peggiore di tutti i tuoi pari ruolo in ogni giornata non entra mai in
     formazione, purché tu ne abbia abbastanza per riempire i posti (flex compreso) */
  const same=pos=>roster.filter(p=>p.pos===pos);
  cands.forEach(c=>{
    if(wks().every(w=>V(c,w)<=0.3))return;
    const sp=same(c.pos);
    if(sp.length>=NEED[c.pos]&&wks().every(w=>sp.every(d=>V(c,w)<=V(d,w))))return;
    let best=null;
    drops.forEach(d=>{
      const g=(lineupTot(roster.filter(x=>x.id!==d.id).concat(c))-base)/n;
      // a parità di guadagno si taglia chi vale meno nel resto della stagione
      const sc=g-0.012*(d.proj||0);
      if(!best||sc>best.sc)best={c,d,gain:g,sc};
    });
    if(best){best.alt=altGain(roster,best.c,best.d);out.push(best)}
  });
  return out.sort((a,b)=>b.gain-a.gain||b.sc-a.sc);
}
function plan(){
  let roster=mine();const steps=[],used=new Set();
  for(let i=0;i<4;i++){
    const m=movesFor(roster,free().filter(p=>!used.has(p.id)))[0];
    if(!m||m.gain<0.4)break;
    steps.push(m);used.add(m.c.id);used.add(m.d.id);
    roster=roster.filter(x=>x.id!==m.d.id).concat(m.c);
  }
  return steps;
}

/* le mosse di un reparto si valutano dando per fatte quelle del piano negli altri reparti:
   un giocatore che non vale nulla si taglia una volta sola, non per ogni libero */
function movesByPos(){
  return POSS.flatMap(pos=>{
    let r=mine();
    PLAN.filter(m=>m.c.pos!==pos).forEach(m=>{r=r.filter(x=>x.id!==m.d.id).concat(m.c)});
    return movesFor(r,free().filter(p=>p.pos===pos));
  }).sort((a,b)=>b.gain-a.gain||b.sc-a.sc);
}

/* ---------- stato della pagina ---------- */
const S={pos:'ALL',rpos:null,metric:'ev',use:null,a:null,b:null,sort:'ev',dir:-1,showMine:true,showOwn:false,q:''};
let MOVES=[],PLAN=[],SIG='';

/* tooltip: qualunque elemento con data-tt dentro un grafico */
function hookTips(){
  const root=$('#view-waiver');if(root.dataset.tt)return;root.dataset.tt='1';
  root.addEventListener('mousemove',e=>{
    const el=e.target.closest('[data-tt]'),wrap=e.target.closest('.chartwrap');
    root.querySelectorAll('.chartwrap .tt').forEach(t=>{if(!wrap||t.parentNode!==wrap)t.remove()});
    if(!el||!wrap)return;
    const r=wrap.getBoundingClientRect();tip(wrap,el.dataset.tt,e.clientX-r.left,e.clientY-r.top);
  });
  root.addEventListener('mouseleave',()=>root.querySelectorAll('.chartwrap .tt').forEach(t=>t.remove()));
}
const own=p=>p.own===MY?'tu':p.own?TBY.get(p.own).abbr:'libero';
const colOf=p=>p.own===MY?C_ME:p.own?C_OTH:C_FREE;
const ttP=(p,extra)=>attr(`<b>${p.name}</b><span>${p.pos} · ${p.nfl} · ${own(p)}</span>`+(extra?'<br>'+extra:''));

/* ---------- misure del reparto ---------- */
const METRICS={
  ev:{l:()=>`Valore atteso a giornata (prossime ${H})`,f:p=>evH(p),u:''},
  ppg:{l:()=>`Punti a gara (${WIN>20?'stagione':'ultime '+WIN})`,f:p=>summary(p,WIN).ppg,u:''},
  tsh:{l:()=>'Target share',f:p=>summary(p,WIN).tsh,u:'%',pos:['RB','WR','TE']},
  tgt:{l:()=>'Target a gara',f:p=>summary(p,WIN).tgt,u:'',pos:['RB','WR','TE']},
  opp:{l:()=>'Opportunità a gara (corse + target)',f:p=>summary(p,WIN).opp,u:'',pos:['RB','WR','TE']},
  rsh:{l:()=>'Quota delle corse',f:p=>summary(p,WIN).rsh,u:'%',pos:['RB','QB']},
  snap:{l:()=>'Snap in attacco',f:p=>summary(p,WIN).snap,u:'%',pos:['QB','RB','WR','TE']},
  rz:{l:()=>'Palloni in red zone a gara',f:p=>summary(p,WIN).rz,u:'',pos:['QB','RB','WR','TE']},
  yds:{l:()=>'Yard a gara',f:p=>summary(p,WIN).yds,u:'',pos:['QB','RB','WR','TE']},
  floor:{l:()=>'Floor (20° percentile)',f:p=>summary(p,WIN).floor,u:''},
  ceil:{l:()=>'Ceiling (80° percentile)',f:p=>summary(p,WIN).ceil,u:''},
  proj:{l:()=>'Proiezione ESPN resto stagione',f:p=>p.proj,u:''}
};
const metricsFor=pos=>Object.keys(METRICS).filter(k=>!METRICS[k].pos||METRICS[k].pos.includes(pos));
/* l'asse X del grafico a dispersione: l'utilizzo che conta in quel reparto */
const XOF={WR:'tsh',TE:'tsh',RB:'opp',QB:'yds'};
const posPool=pos=>POOL.filter(p=>p.pos===pos);
const topOf=(pos,n)=>posPool(pos).sort((a,b)=>evH(b)-evH(a)).slice(0,n);

/* ---------- KPI ---------- */
function renderStrip(){
  const best=MOVES[0],tot=PLAN.reduce((s,m)=>s+m.gain,0);
  const ros=mine(),stS=starters(ros);
  const gaps=POSS.map(pos=>{
    const st=ros.filter(p=>p.pos===pos&&stS.has(p.id)).map(valH).sort((a,b)=>a-b);
    const fr=free().filter(p=>p.pos===pos).map(valH).sort((a,b)=>b-a);
    return{pos,d:st.length&&fr.length?fr[0]-st[0]:(fr[0]||0)}}).sort((a,b)=>b.d-a.d);
  const card=(title,k1,v1,k2,v2,verd,col)=>`<div class="sc" style="border-top-color:${col||'var(--k-muted)'}"><h4>${title}</h4>
    <div class="kv"><span>${k1}</span><b>${v1}</b></div><div class="kv"><span>${k2}</span><b>${v2}</b></div><div class="verd">${verd}</div></div>`;
  $('#wv-strip').innerHTML=
    card('Mossa migliore','prendi',best?esc(best.c.name):'—','taglia',best?esc(best.d.name):'—',
      best&&best.gain>0.4?`+${n1(best.gain)} punti a giornata ai titolari (${bTxt()}). Sull'altra base: ${best.alt>=0?'+':''}${n1(best.alt)} ${bShort(OTHER())}.`:'Nessun libero migliora i titolari: la rosa è già al massimo.',C_FREE)+
    card('Piano completo','mosse',PLAN.length,'guadagno',PLAN.length?'+'+n1(tot)+' a giornata':'—',
      PLAN.length?(BASIS==='ev'?`Sulle prossime ${weeks().length} giornate: ${n0(tot*weeks().length)} punti in più.`:`Con queste mosse, ${winTxt()} avresti fatto ${n0(tot*pastWeeks().length)} punti in più.`):'Tieni la rosa così.',C_FREE)+
    card('Reparto da guardare','più scoperto',gaps[0].d>0?gaps[0].pos:'nessuno','scarto',gaps[0].d>0?'+'+n1(gaps[0].d)+' a gara':'—',
      gaps[0].d>0?`Il miglior ${gaps[0].pos} libero vale più del tuo titolare più debole del reparto (${bShort()}).`:'Ogni tuo titolare vale più del miglior libero.',C_ME)+
    card('Pool','liberi',free().length,'tuoi',ros.length,BASIS==='ev'?`Dati fino alla giornata ${LAST}; orizzonte giornate ${weeks()[0]}–${weeks().slice(-1)[0]}.`:`Confronto sulle partite giocate: giornate ${pastWeeks()[0]}–${LAST}.`);
}

/* ---------- mosse ---------- */
function renderMoves(){
  /* con tutti i reparti al massimo tre mosse per ruolo, altrimenti un buco solo riempie la lista */
  const per={};
  const list=MOVES.filter(m=>m.gain>=0.5).filter(m=>S.pos==='ALL'?((per[m.c.pos]=(per[m.c.pos]||0)+1)<=3):m.c.pos===S.pos).slice(0,12);
  if(!list.length){$('#wv-moves').innerHTML='<p class="cn">Nessun libero in questo reparto migliora la formazione.</p>';return}
  const max=Math.max(...list.map(m=>m.gain),0.5);
  $('#wv-moves').innerHTML=list.map((m,i)=>{
    const c=m.c,d=m.d,fc=summary(c,WIN),fd=summary(d,WIN);
    const why=[`attesi ${n1(evH(c))} contro ${n1(evH(d))}`,`giocati ${n1(fc.ppg)} contro ${n1(fd.ppg)}`];
    if(fc.tsh!=null&&['WR','TE','RB'].includes(c.pos))why.push(`${n0(fc.tsh)}% target`);
    const warn=(d.proj||0)>(c.proj||0)+15?' · <span style="color:var(--delayed)">a lungo termine vale più '+esc(last(d.name))+'</span>':'';
    const on=S.b===c.id&&S.a===d.id?' on':'';
    return`<div class="mv${on}" data-mv="${i}" data-tt="${attr(`<b>${esc(c.name)} al posto di ${esc(d.name)}</b><span>titolari: ${m.gain>=0?'+':''}${n1(m.gain)} punti a giornata ${bTxt()}</span><span>${bShort(OTHER())}: ${m.alt>=0?'+':''}${n1(m.alt)}</span>`)}">
      <div class="who"><span class="in">${esc(c.name)}</span> <span style="color:var(--k-muted)">${c.pos} ${c.nfl}</span>
        <small><span class="out">al posto di ${esc(d.name)}</span> · ${why.join(' · ')}${warn}</small></div>
      <div class="bar"><i style="width:${Math.max(2,Math.max(0,m.gain)/max*100)}%"></i></div>
      <div class="v">${m.gain>=0?'+':''}${n1(m.gain)}<small title="${bShort(OTHER())}" style="display:block;font-size:10px;font-weight:400;color:${m.alt>0.4?'var(--k-muted)':'var(--delayed)'}">${bShort(OTHER())} ${m.alt>=0?'+':''}${n1(m.alt)}</small></div></div>`}).join('');
  $('#wv-moves').onclick=e=>{const r=e.target.closest('[data-mv]');if(!r)return;const m=list[+r.dataset.mv];
    S.a=m.d.id;S.b=m.c.id;S.rpos=m.c.pos;renderAll(false);document.getElementById('wv-h2h-cards').scrollIntoView({behavior:'smooth',block:'start'})};
  $('#wv-plan').innerHTML=PLAN.length?`<div class="plan">${PLAN.map((m,i)=>`<div class="st"><div class="n">MOSSA ${i+1}</div>
      <div><b>+ ${esc(m.c.name)}</b> <span style="color:var(--k-muted)">${m.c.pos}</span></div>

      :g<-0.4?`Lo scambio <b>toglie</b> ${n1(-g)} punti a giornata ai titolari: ${esc(A.name)} serve di più.`
      :`Per i titolari non cambia quasi nulla (${g>=0?'+':''}${n1(g)} a giornata): la scelta vale solo come riserva o per i bye.`);
    v.push(BASIS==='ev'?`Sulle partite giocate ${winTxt()} la stessa mossa avrebbe dato <b>${ga>=0?'+':''}${n1(ga)}</b> a giornata${(ga<0.4)!==(g<0.4)?': i dati passati e il valore atteso non sono d\'accordo, guarda il grafico dei punti qui sopra':''}.`
      :`Sul valore atteso delle prossime ${weeks().length} la stessa mossa vale <b>${ga>=0?'+':''}${n1(ga)}</b> a giornata${(ga<0.4)!==(g<0.4)?': passato e proiezioni non sono d\'accordo':''}.`);
    const bm=movesFor(ros,[B])[0];
    if(bm&&bm.d.id!==A.id&&bm.gain>g+0.4)v.push(`Per prendere ${esc(last(B.name))} il taglio migliore però è <b>${esc(bm.d.name)}</b>: +${n1(bm.gain)} a giornata.`);
  }
  const fa=summary(A,WIN),fb=summary(B,WIN);
  if(A.pos!==B.pos){
    v.push(`Ruoli diversi (${A.pos} e ${B.pos}): il confronto vero è il guadagno della formazione qui sopra. Per i numeri di reparto scegli un tuo ${B.pos}.`);
    v.push(`${esc(last(B.name))}: ${n1(fb.ppg)} punti a gara nella forma recente, ${n1(evH(B))} attesi a giornata.`);
    [A,B].forEach(p=>{const ij=injOf(p);if(OUT.includes(p.inj)||p.inj==='D'||(ij&&ij.s))v.push(`${esc(p.name)}: ${esc(p.inj||ij.s)}${ij&&ij.i?' ('+esc(ij.i)+')':''}.`)});
    return v;
  }
  if(fa.tsh!=null&&fb.tsh!=null&&Math.abs(fa.tsh-fb.tsh)>=4)v.push(`Target share: ${esc(last(fb.tsh>fa.tsh?B.name:A.name))} ne prende ${n1(Math.abs(fa.tsh-fb.tsh))} punti percentuali in più (${n1(Math.max(fa.tsh,fb.tsh))}% contro ${n1(Math.min(fa.tsh,fb.tsh))}%). È il dato che si ripete di più da una settimana all'altra.`);
  if(fa.opp!=null&&fb.opp!=null&&Math.abs(fa.opp-fb.opp)>=3&&['RB'].includes(B.pos))v.push(`Opportunità: ${n1(fb.opp)} palloni a gara per ${esc(last(B.name))}, ${n1(fa.opp)} per ${esc(last(A.name))}.`);
  if(fa.ppg!=null&&fb.ppg!=null)v.push(`Forma${WIN>20?' di stagione':' delle ultime '+WIN+' giornate'}: ${esc(last(B.name))} ${n1(fb.ppg)} punti a gara in ${fb.g} partite, ${esc(last(A.name))} ${n1(fa.ppg)} in ${fa.g}.${fb.g<3||fa.g<3?' Poche partite: conta più il volume dei punti.':''}`);
  const sa=summary(A,99),sb=summary(B,99);
  if(fb.ppg!=null&&sb.ppg!=null&&fb.ppg-sb.ppg>=4)v.push(`${esc(last(B.name))} è in crescita: ${n1(fb.ppg)} di recente contro ${n1(sb.ppg)} di stagione.`);
  if(fa.ppg!=null&&sa.ppg!=null&&sa.ppg-fa.ppg>=4)v.push(`${esc(last(A.name))} è in calo: ${n1(fa.ppg)} di recente contro ${n1(sa.ppg)} di stagione.`);
  if(fa.floor!=null&&fb.floor!=null&&Math.abs(fa.floor-fb.floor)>=3)v.push(`Il pavimento più alto è di ${esc(last(fa.floor>fb.floor?A.name:B.name))} (${n1(Math.max(fa.floor,fb.floor))} contro ${n1(Math.min(fa.floor,fb.floor))}): meno rischio nelle settimane storte.`);
  if((A.proj||0)>(B.proj||0)+15)v.push(`Nel resto della stagione ESPN proietta ${esc(last(A.name))} a ${n0(A.proj)} contro ${n0(B.proj)}: se il problema è solo di queste settimane, tagliarlo può costare ai playoff.`);
  [A,B].forEach(p=>{const ij=injOf(p);if(OUT.includes(p.inj)||p.inj==='D'||(ij&&ij.s))v.push(`${esc(p.name)}: ${esc(p.inj||ij.s)}${ij&&ij.i?' ('+esc(ij.i)+')':''}.`)});
  if(A.bye&&A.bye===B.bye&&A.bye>=WEEK)v.push(`Stesso bye (giornata ${A.bye}).`);
  const tr=(TOP.trending||{})[B.id];
  if(tr&&tr.add>=20000)v.push(`${esc(last(B.name))} è stato aggiunto da ${Math.round(tr.add/1000)} mila squadre ESPN nelle ultime 24 ore: nelle altre leghe se ne sono accorti.`);
  return v;
}
function renderH2H(){
  const ros=mine().sort((a,b)=>evH(b)-evH(a));
  if(!ros.length)return;
  const pos=S.rpos;
  let A=ros.find(p=>p.id===S.a);
  let B=POOL.find(p=>p.id===S.b);
  if(!B){const m=MOVES.find(m=>m.c.pos===pos);B=m?m.c:free().filter(p=>p.pos===pos).sort((a,b)=>valH(b)-valH(a))[0]}
  if(!A){const m=MOVES.find(m=>B&&m.c.id===B.id);A=m?m.d:ros.filter(p=>p.pos===pos).sort((a,b)=>valH(a)-valH(b))[0]||ros[ros.length-1]}
  if(!A||!B)return;
  S.a=A.id;S.b=B.id;
  $('#wv-mine').innerHTML=ros.map(p=>`<option value="${p.id}"${p.id===A.id?' selected':''}>${esc(p.name)} · ${p.pos}</option>`).join('');
  const dl=$('#wv-free-list');
  dl.innerHTML=POOL.filter(p=>p.own!==MY).sort((a,b)=>evH(b)-evH(a)).slice(0,300).map(p=>`<option value="${attr(p.name)}">${p.pos} ${p.nfl} · ${own(p)}</option>`).join('');
  if(document.activeElement!==$('#wv-free'))$('#wv-free').value=B.name;   // il live ridisegna ogni 30 s: non sovrascrivere chi sta scrivendo
  $('#wv-h2h-cards').innerHTML=h2hCard(A,C_ME,'il tuo')+h2hCard(B,C_FREE,B.own?'in rosa a '+esc(TBY.get(B.own).name):'libero');
  const L2=[{p:A,c:C_ME},{p:B,c:C_FREE}];
  lineChart($('#wv-h2h-pts'),L2,r=>r[1],{future:true,minMax:10});
  $('#wv-h2h-lg').innerHTML=L2.map(x=>`<span><i style="background:${x.c};width:9px;height:9px;border-radius:50%"></i>${esc(x.p.name)}</span>`).join('')+'<span><i style="background:#8593A2;width:16px;height:2px"></i>giocate</span><span><i style="border-top:2px dashed #8593A2;height:0;width:16px;background:transparent"></i>attese</span>';
  const opts=useFor(B.pos);if(!opts.includes(S.use))S.use=opts[0];
  const ch=$('#wv-use');
  ch.innerHTML=opts.map(k=>`<button data-c="${k}" class="${k===S.use?'on':''}">${USE[k][0]}</button>`).join('');
  ch.onclick=e=>{const b=e.target.closest('button');if(!b)return;S.use=b.dataset.c;renderH2H()};
  const u=USE[S.use];
  lineChart($('#wv-h2h-use'),L2,u[1],{u:u[2],minMax:S.use==='tsh'||S.use==='snap'?20:5});
  barsChart(A,B);
  $('#wv-h2h-read').innerHTML=readH2H(A,B).map(t=>`<li>${t}</li>`).join('');
  document.querySelectorAll('#wv-moves .mv').forEach(r=>r.classList.remove('on'));
}

/* ---------- tabella ---------- */
const COLS=[
  ['Giocatore','name',null],['Pos','pos',null],['Stato','own',null],
  ['Attesi/g','ev',p=>evH(p)],['Δ vs tuo','dv',p=>dvOf(p)],
  ['Forma','ppg',p=>summary(p,WIN).ppg],['Stagione','ppgS',p=>summary(p,99).ppg],['Trend','tr',p=>{const a=summary(p,3).ppg,b=summary(p,99).ppg;return a==null||b==null?null:a-b}],
  ['Tgt/g','tgt',p=>summary(p,WIN).tgt],['Tgt share','tsh',p=>summary(p,WIN).tsh,'%'],['Corse/g','car',p=>summary(p,WIN).car],
  ['Opp/g','opp',p=>summary(p,WIN).opp],['Snap','snap',p=>summary(p,WIN).snap,'%'],['RZ/g','rz',p=>summary(p,WIN).rz],
  ['TD','td',p=>summary(p,WIN).td],['WOPR','wopr',p=>{const a=adv(p,26);return a&&a.wopr?a.wopr:null}],
  ['Floor','floor',p=>summary(p,WIN).floor],['Ceil','ceil',p=>summary(p,WIN).ceil],
  ['ESPN g'+WEEK,'pw',p=>PW(p,WEEK)],['Proj RoS','proj',p=>p.proj],['% ESPN','pct',p=>p.pct,'%'],['+24h','add',p=>((TOP.trending||{})[p.id]||{}).add||null],['Bye','bye',p=>p.bye]
];
/* gruppi di colonne: 23 colonne insieme non stanno in una finestra normale */
const CG={val:['Valore',['ev','dv','ppg','ppgS','tr','pw','proj','bye']],
  use:['Utilizzo',['ppg','tgt','tsh','car','opp','snap','rz','td','wopr']],
  risk:['Rischio e mercato',['ev','floor','ceil','pct','add','bye']],
  all:['Tutte',null]};
const visCols=()=>{const g=CG[S.cg||'val'][1];return COLS.filter((c,i)=>i<3||!g||g.includes(c[1]))};
let MYST=null;
function dvOf(p){
  if(!MYST)return null;
  const el=p.pos==='RB'||p.pos==='WR'?[...MYST[p.pos]||[],...MYST.FLEX||[]]:(MYST[p.pos]||[]);
  if(!el.length)return null;
  return valH(p)-Math.min(...el);
}
function renderTable(){
  const ros=mine(),stS=starters(ros);
  MYST={};ros.filter(p=>stS.has(p.id)).forEach(p=>{(MYST[p.pos]=MYST[p.pos]||[]).push(valH(p))});
  COLS.find(c=>c[1]==='dv')[0]=BASIS==='ev'?'Δ vs tuo':'Δ vs tuo (giocati)';
  const qq=S.q.trim().toLowerCase();
  let list=POOL.filter(p=>(S.pos==='ALL'||p.pos===S.pos)&&(qq?p.name.toLowerCase().includes(qq):true)&&
    (p.own===MY?S.showMine:p.own?S.showOwn:true));
  const col=COLS.find(c=>c[1]===S.sort)||COLS[3];
  const key=col[2]||(p=>col[1]==='name'?p.name:col[1]==='pos'?p.pos:own(p));
  list.sort((a,b)=>{const x=key(a),y=key(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;
    return(typeof x==='string'?x.localeCompare(y):x-y)*S.dir});
  list=list.slice(0,qq?80:120);
  const mx=Math.max(...list.map(p=>Math.max(0,...series(p,r=>r[1]).filter(v=>v!=null))),10);
  const fmt=(c,v)=>v==null?'—':c[1]==='wopr'?f2(v):c[1]==='add'?(v>=1000?Math.round(v/1000)+'k':v):c[1]==='bye'||c[1]==='td'?v:
    c[1]==='dv'||c[1]==='tr'?`<span style="color:${v>0.4?'var(--live)':v<-0.4?'var(--offline)':'var(--k-muted)'}">${v>0?'+':''}${n1(v)}</span>`:n1(v)+(c[3]||'');
  const VC=visCols();
  const cg=$('#wv-cg');if(cg){cg.innerHTML=Object.entries(CG).map(([k,v])=>`<button data-c="${k}" class="${k===(S.cg||'val')?'on':''}">${v[0]}</button>`).join('');
    cg.onclick=e=>{const b=e.target.closest('button');if(b){S.cg=b.dataset.c;renderTable()}}}
  $('#wv-table').innerHTML=`<thead><tr>${VC.map(c=>`<th data-sort="${c[1]}" class="${c[2]?'num':''}${S.sort===c[1]?' on':''}">${c[0]}${S.sort===c[1]?(S.dir<0?' ↓':' ↑'):''}</th>`).join('')}</tr></thead><tbody>`+
    list.map(p=>{
      const sp=series(p,r=>r[1]).map(v=>v==null?'<i class="z"></i>':`<i style="height:${Math.max(2,v/mx*18).toFixed(0)}px" title="${n1(v)}"></i>`).join('');
      const ij=injOf(p),st=p.inj||(ij&&ij.s)||'';
      return`<tr class="${p.own===MY?'mine':!p.own?'free':''}"><td data-pid="${p.id}"><b>${esc(p.name)}</b> <span style="color:var(--k-muted)">${p.nfl}</span>${st?` <span class="tag2 ${OUT.includes(st)||st==='D'?'bad':'warn'}">${esc(st)}</span>`:''}<span class="spk">${sp}</span></td>
        <td><span class="pos pos-${p.pos}">${p.pos}</span></td>
        <td>${p.own===MY?'<span class="tag2" style="color:#3CC7F5">tuo</span>':p.own?`<span class="tag2">${esc(TBY.get(p.own).abbr)}</span>`:'<span class="tag2 acc">libero</span>'}</td>
        ${VC.slice(3).map(c=>`<td class="num">${fmt(c,c[2](p))}</td>`).join('')}</tr>`}).join('')+'</tbody>';
  $('#wv-table').querySelector('thead').onclick=e=>{const th=e.target.closest('th');if(!th)return;const k=th.dataset.sort;
    if(S.sort===k)S.dir=-S.dir;else{S.sort=k;S.dir=['name','pos','own','bye'].includes(k)?1:-1}renderTable()};
}

/* ---------- regole dei waiver: priorità, quando si elaborano, chi ti sta davanti ---------- */
function renderRules(){
  const el=$('#wv-rules');if(!el)return;
  const R0=TOP.rules||{},ST=TOP.standings||{};
  const order=Object.entries(ST).filter(([,v])=>v.waiver).sort((a,b)=>a[1].waiver-b[1].waiver);
  const myR=(ST[MY]||{}).waiver;
  const it={MONDAY:'lun',TUESDAY:'mar',WEDNESDAY:'mer',THURSDAY:'gio',FRIDAY:'ven',SATURDAY:'sab',SUNDAY:'dom'};
  const days=(R0.waiverDays||[]).map(d=>it[d]||d).join(' · ');
  /* chi ti precede e di cosa ha bisogno: è lui che può soffiarti il libero */
  const short=t=>{const r=POOL.filter(p=>p.own===+t);return ['QB','RB','WR','TE'].filter(pos=>r.filter(p=>p.pos===pos).length<=({QB:1,RB:2,WR:2,TE:1})[pos])};
  const ahead=order.filter(([t,v])=>myR&&v.waiver<myR&&+t!==MY);
  el.innerHTML=`<span><b>Priorità waiver:</b> ${order.map(([t,v])=>`<span style="${+t===MY?'color:var(--k-me);font-weight:700':''}">${v.waiver}° ${esc(TBY.get(+t).abbr)}</span>`).join(' · ')}</span>`+
    `<span style="color:var(--k-muted)">${R0.waiverType==='WAIVERS_TRADITIONAL'?'ordine tradizionale, chi prende scende in fondo':''}${R0.faab?' · FAAB':''}${days?` · elaborazione ${days}${R0.waiverHour!=null?' alle '+R0.waiverHour+':00 (orario di ESPN)':''}`:''}${R0.waiverHours?` · un giocatore tagliato resta in waiver ${R0.waiverHours} ore`:''}</span>`+
    (ahead.length?`<span class="sp">Ti precede ${ahead.map(([t])=>{const s=short(t);return`<b>${esc(TBY.get(+t).name)}</b>${s.length?' (corto di '+s.join(', ')+')':''}`}).join(', ')}: un libero in quei reparti rischia di andare a lui.</span>`:'<span class="sp" style="color:var(--live)">Sei primo nella priorità: ogni richiesta di waiver passa prima la tua.</span>');
}

/* ---------- regia ---------- */
function posChips(el,list,cur,cb){
  el.innerHTML=list.map(c=>`<button data-c="${c}" class="${c===cur?'on':''}">${c==='ALL'?'Tutti':c}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(b)cb(b.dataset.c)};
}
function renderAll(recompute){
  hookTips();
  /* il live richiama la pagina ogni 30 secondi: si ricalcola solo se le rose sono cambiate */
  const sig=H+'|'+BASIS+'|'+WIN+'|'+POOL.map(p=>p.own||0).join('');
  if(sig!==SIG){SIG=sig;PLAN=plan();MOVES=movesByPos()}
  if(!S.rpos)S.rpos=MOVES[0]?MOVES[0].c.pos:'WR';
  const mk=metricsFor(S.rpos);if(!mk.includes(S.metric))S.metric='ev';
  $('#wv-metric').innerHTML=mk.map(k=>`<option value="${k}"${k===S.metric?' selected':''}>${METRICS[k].l()}</option>`).join('');
  $('#wv-basis').innerHTML=[['ev','Valore atteso'],['past','Partite giocate']].map(([k,l])=>`<button data-c="${k}" class="${k===BASIS?'on':''}">${l}</button>`).join('');
  $('#wv-basis').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.c===BASIS)return;BASIS=b.dataset.c;if(S.metric==='ev'||S.metric==='ppg')S.metric=BASIS==='ev'?'ev':'ppg';renderAll(false)};
  $('#wv-moves-cn').innerHTML=`Per ogni libero il taglio che rende di più, dando per fatte le mosse del piano negli altri reparti (chi non vale nulla si taglia una volta sola). A parità di guadagno si taglia chi vale meno nel resto della stagione. La barra è il guadagno dei titolari in punti a giornata, ${BASIS==='ev'?`sul valore atteso delle prossime ${weeks().length}`:`rigiocando le partite ${winTxt()} con i punti veri`}; sotto il numero c'è lo stesso guadagno sull'altra base. Tocca una riga per aprire il testa a testa qui sotto.`;
  posChips($('#wv-pos'),['ALL',...POSS],S.pos,c=>{S.pos=c;if(c!=='ALL'){S.rpos=c;S.a=null;S.b=null}renderAll(false)});
  posChips($('#wv-rpos'),POSS,S.rpos,c=>{S.rpos=c;if(S.pos!=='ALL')S.pos=c;S.a=null;S.b=null;renderAll(false)});
  $('#wv-info').textContent=`${free().length} liberi · forma fino alla giornata ${LAST}`;
  renderRules();
  renderStrip();renderMoves();renderGap();renderLadder();renderScatter();renderH2H();renderTable();
}
$('#wv-win').onchange=e=>{WIN=+e.target.value;renderAll(false)};
$('#wv-hor').onchange=e=>{H=+e.target.value;renderAll()};
$('#wv-metric').onchange=e=>{S.metric=e.target.value;renderLadder()};
$('#wv-mine').onchange=e=>{S.a=+e.target.value;renderH2H()};
$('#wv-free').onchange=e=>{const v=e.target.value.toLowerCase(),p=POOL.find(x=>x.name.toLowerCase()===v);if(p){S.b=p.id;renderH2H()}};
$('#wv-showmine').onchange=e=>{S.showMine=e.target.checked;renderTable()};
$('#wv-showown').onchange=e=>{S.showOwn=e.target.checked;renderTable()};
$('#wv-q').oninput=e=>{S.q=e.target.value;renderTable()};

R.waiver=()=>renderAll(true);
if((location.hash||'').slice(1)==='waiver')window.DWR_VIEW('waiver');
})();
</script>
