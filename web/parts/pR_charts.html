<script>
/* ===== attrezzi comuni dei grafici di stagione =====
   - colori fissi per squadra fantasy (seguono la squadra, mai la posizione in classifica):
     gli stessi dello Storico
   - tooltip: qualunque elemento con data-tip="Titolo|riga|riga" dentro un .chartwrap
   - griglia e assi recessivi, testo sempre nei colori del testo */
(()=>{
'use strict';
const TEAMCOL={3:'#3CC7F5',1:'#F47272',2:'#34D399',4:'#F4A63B'};   // Sommo, Oscurus, lasers, Capi
const INK='#E8EDF2',MUTED='#7C8996',GRID='#1E2833',SURF='#10161E';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const attr=s=>esc(s);
const svg=(W,H,inner,label)=>`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'grafico')}" style="width:100%;height:auto;display:block;overflow:visible">${inner}</svg>`;
const fx=v=>(+v).toFixed(1);
/* griglia orizzontale con etichette a sinistra */
function yGrid(L,R,W,y,ticks,fmt){
  return ticks.map(v=>`<line x1="${L}" y1="${fx(y(v))}" x2="${W-R}" y2="${fx(y(v))}" stroke="${GRID}"/><text x="${L-6}" y="${fx(y(v)+3)}" fill="${MUTED}" font-size="9.5" text-anchor="end">${fmt?fmt(v):v}</text>`).join('');
}
function niceTicks(lo,hi,n){
  const span=hi-lo||1,step0=span/(n||4),mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(k=>k*mag).find(s=>s>=step0)||step0;
  const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(6));return out;
}
/* tooltip unico per tutte le pagine */
function placeTip(wrap,html,x,y){
  let t=wrap.querySelector(':scope > .tt');
  if(!html){if(t)t.remove();return}
  if(!t){t=document.createElement('div');t.className='tt';wrap.appendChild(t)}
  t.innerHTML=html;
  const w=wrap.clientWidth;
  t.style.left=Math.min(Math.max(4,x-t.offsetWidth/2),w-t.offsetWidth-4)+'px';
  t.style.top=Math.max(0,y-t.offsetHeight-12)+'px';
}
document.addEventListener('mousemove',e=>{
  const el=e.target.closest&&e.target.closest('[data-tip]');
  document.querySelectorAll('.chartwrap > .tt[data-own="tip"]').forEach(t=>{if(!el||t.parentNode!==el.closest('.chartwrap'))t.remove()});
  if(!el)return;
  const wrap=el.closest('.chartwrap');if(!wrap)return;
  const [h,...rest]=el.dataset.tip.split('|');
  const r=wrap.getBoundingClientRect();
  placeTip(wrap,`<b>${h}</b>${rest.map(s=>`<span style="display:block">${s}</span>`).join('')}`,e.clientX-r.left,e.clientY-r.top);
  const t=wrap.querySelector(':scope > .tt');if(t)t.dataset.own='tip';
});
/* densità normale, per le curve di probabilità */
const npdf=(x,m,s)=>Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
/* larghezza vera del contenitore: il grafico si disegna 1:1, il testo resta della sua misura
   e l'altezza la decide chi disegna (niente grafici che si gonfiano su schermi larghi) */
const wOf=(el,def,min)=>Math.max(min||300,Math.floor((el&&el.clientWidth)||def||600));
/* finestra ridimensionata: si ridisegna la pagina aperta */
let rz=null,lastW=window.innerWidth;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if(Math.abs(window.innerWidth-lastW)<40)return;lastW=window.innerWidth;
  const v=(location.hash||'').slice(1);if(v&&window.DWR_VIEW)window.DWR_VIEW(v)},250)});
window.DWRC={TEAMCOL,INK,MUTED,GRID,SURF,esc,attr,svg,yGrid,niceTicks,npdf,fx,wOf};
})();
</script>
