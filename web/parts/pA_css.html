<style>
/* ---------- pagine di analisi (stesso sistema visivo della console) */
.an-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;margin:0 2px 12px}
.an-head h2{font:700 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;color:var(--k-ink)}
.an-head p{margin:0;font-size:12.5px;color:var(--k-muted);max-width:70ch}
.an-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--k-p);border:1px solid var(--k-line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.an-bar label{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--k-muted)}
.an-bar .sp{margin-left:auto;font-size:11.5px;color:var(--k-muted)}
.wkpick{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--k-muted)}
.wkpick button{padding:3px 8px;line-height:1.1}
.wkpick button[disabled]{opacity:.35;cursor:default}
.wkpick b{min-width:64px;text-align:center;font:700 12.5px var(--mono);color:var(--k-ink)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.sc{background:var(--k-p);border:1px solid var(--k-line);border-radius:10px;padding:10px 12px;border-top:3px solid var(--k-muted)}
.sc.p-QB{border-top-color:var(--QB)}.sc.p-RB{border-top-color:var(--RB)}.sc.p-WR{border-top-color:var(--WR)}.sc.p-TE{border-top-color:var(--TE)}.sc.p-K{border-top-color:var(--K)}.sc.p-DST{border-top-color:var(--DST)}
.sc h4{margin:0 0 6px;font:700 16px/1 var(--display);letter-spacing:.04em}
.sc .kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--k-muted);padding:1px 0}
.sc .kv b{color:var(--k-ink);font-variant-numeric:tabular-nums}
.sc .verd{margin-top:6px;font-size:11.5px;color:var(--k-y);line-height:1.35}
.tiercols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.tcol{background:var(--k-p);border:1px solid var(--k-line);border-radius:10px;overflow:hidden}
.tcol>h3{margin:0;padding:8px 12px;border-bottom:1px solid var(--k-line);font:700 15px/1 var(--display);letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.tcol>h3 small{margin-left:auto;font:500 11px var(--mono);color:var(--k-muted);letter-spacing:0}
.tier{border-bottom:1px solid var(--k-line)}
.tier:last-child{border-bottom:0}
.tier>.th{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--k-p2);font:600 10.5px var(--mono);letter-spacing:.07em;color:var(--k-muted)}
.tier>.th b{color:var(--k-ink)}
.tier>.th .cliff{margin-left:auto;color:var(--delayed)}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 12px;align-items:center;cursor:pointer}
.prow:hover{background:#131B24}
.prow.gone{opacity:.38}
.prow.gone .nm{text-decoration:line-through}
.prow .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{font-weight:400;color:var(--k-muted);margin-left:4px}
.prow .vv{font:600 12px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.prow .bar{grid-column:1/3;height:5px;background:var(--k-p2);border-radius:3px;overflow:hidden}
.prow .bar i{display:block;height:100%;border-radius:3px}
.prow .mt{grid-column:1/3;font:10.5px var(--mono);color:#6C7987;display:flex;gap:8px;flex-wrap:wrap}
.prow .mt .up{color:var(--live)}.prow .mt .dn{color:var(--offline)}.prow .mt .fl{color:var(--delayed)}
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:10px;align-items:start}
.chartcard{background:var(--k-p);border:1px solid var(--k-line);border-radius:10px;padding:12px 14px}
.chartcard h3{margin:0 0 2px;font:600 13px var(--sans);color:var(--k-ink)}
.chartcard p.cn{margin:0 0 10px;font-size:11.5px;color:var(--k-muted)}
.legend2{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 0;font-size:11.5px;color:var(--k-muted)}
.legend2 span{display:flex;align-items:center;gap:5px}
.legend2 i{width:16px;height:3px;border-radius:2px;display:inline-block}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.tt{position:absolute;pointer-events:none;background:#060A0F;border:1px solid var(--k-line);border-radius:7px;padding:6px 9px;font-size:11.5px;color:var(--k-ink);box-shadow:0 6px 18px rgb(0 0 0/.55);z-index:5;min-width:120px}
.tt b{display:block;font-size:12.5px}
.tt span{color:var(--k-muted)}
.antable{width:100%;border-collapse:collapse;font-size:12.5px}
.antable th{position:sticky;top:0;background:var(--k-p);font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--k-muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--k-line);white-space:nowrap}
.antable th.num,.antable td.num{text-align:right;font-variant-numeric:tabular-nums}
.antable td{padding:5px 8px;border-bottom:1px solid #18202A}
.antable tr.mine td{background:color-mix(in srgb,var(--k-me) 8%,transparent)}
.antable .mini{display:inline-block;width:52px;height:6px;background:var(--k-p2);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}
.antable .mini i{display:block;height:100%;border-radius:3px}
.tag2{display:inline-block;font:600 10px var(--mono);padding:2px 5px;border-radius:4px;background:var(--k-p2);color:var(--k-muted);margin-right:4px;white-space:nowrap}
.tag2.good{background:color-mix(in srgb,var(--live) 18%,transparent);color:var(--live)}
.tag2.warn{background:color-mix(in srgb,var(--delayed) 18%,transparent);color:var(--delayed)}
.tag2.bad{background:color-mix(in srgb,var(--offline) 18%,transparent);color:var(--offline)}
.tag2.acc{background:color-mix(in srgb,var(--k-y) 20%,transparent);color:var(--k-y)}
/* profili */
.prof{display:grid;grid-template-columns:320px minmax(0,1fr);gap:10px;align-items:start}
.plist{background:var(--k-p);border:1px solid var(--k-line);border-radius:10px;overflow:hidden}
.plist .ph{padding:8px 10px;border-bottom:1px solid var(--k-line);display:flex;gap:6px;flex-wrap:wrap}
.plist .pl{height:620px;overflow:auto}
.plist .pi{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #18202A;cursor:pointer}
.plist .pi:hover{background:#131B24}
.plist .pi.on{background:color-mix(in srgb,var(--k-y) 14%,transparent)}
.plist .pi b{font-size:12.5px;font-weight:600}
.plist .pi small{display:block;color:var(--k-muted);font-size:10.5px}
.plist .pi .pv{font:600 12px var(--mono);color:var(--k-ink)}
.card2{background:var(--k-p);border:1px solid var(--k-line);border-radius:10px;padding:14px 16px}
.card2 .hdr{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;border-bottom:1px solid var(--k-line);padding-bottom:10px;margin-bottom:12px}
.card2 .hdr h3{margin:0;font:700 28px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.card2 .hdr .sub{font-size:12px;color:var(--k-muted)}
.card2 .hdr .big{margin-left:auto;text-align:right}
.card2 .hdr .big b{display:block;font:700 34px/1 var(--display);color:var(--k-y);font-variant-numeric:tabular-nums}
.card2 .hdr .big small{font:11px var(--mono);color:var(--k-muted);letter-spacing:.04em}
.mrow{display:grid;grid-template-columns:132px 1fr 62px;gap:8px;align-items:center;padding:4px 0;font-size:12px}
.mrow .l{color:var(--k-muted)}
.mrow .t{background:var(--k-p2);height:8px;border-radius:4px;overflow:hidden;position:relative}
.mrow .t i{display:block;height:100%;border-radius:4px;background:var(--k-me)}
.mrow .t u{position:absolute;top:-2px;width:2px;height:12px;background:var(--k-muted);text-decoration:none}
.mrow .v{text-align:right;font:600 12px var(--mono);font-variant-numeric:tabular-nums}
.verdict2{margin-top:12px;border-top:1px solid var(--k-line);padding-top:10px}
.verdict2 h4{margin:0 0 6px;font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--k-muted)}
.verdict2 ul{margin:0;padding-left:16px}
.verdict2 li{font-size:12.5px;margin:3px 0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
/* reparti */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:9px}
.tm{background:var(--k-p);border:1px solid var(--k-line);border-radius:10px;padding:10px 12px}
.tm .th2{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.tm .th2 b{font:700 20px/1 var(--display);letter-spacing:.03em}
.tm .th2 small{color:var(--k-muted);font-size:11px}
.tm .th2 .tot{margin-left:auto;font:600 13px var(--mono);color:var(--k-y)}
.tm .un{display:grid;grid-template-columns:30px 1fr auto;gap:4px 7px;font-size:11.5px;align-items:center;padding:1px 0}
.tm .un .p{font:700 9.5px var(--mono);text-align:center;border-radius:3px;color:#0B0F14;padding:2px 0}
.tm .un .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .un .v{font:600 11px var(--mono);color:var(--k-muted)}
.tm .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:3px}
/* la linea si disegna quando compare: dà il senso del punto che arriva */
@keyframes drawline{from{stroke-dashoffset:2400}to{stroke-dashoffset:0}}
/* stato a riposo già visibile: se l'animazione non parte, la linea resta piena */
.drawline{stroke-dasharray:2400;stroke-dashoffset:0;animation:drawline .9s ease-out}
@media (prefers-reduced-motion:reduce){.drawline{animation:none;stroke-dasharray:none}}
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.livedot{animation:none}}
.tmrow{display:grid;gap:4px 8px;align-items:center;font-size:11.5px}
.tmrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmrow .p{font:700 9px/1 var(--mono);text-align:center;border-radius:3px;color:#0B0F14;padding:3px 0}
.tmrow .pts{font:700 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--k-ink)}
.tmrow .pts.na{color:#4F5C6B;font-weight:400}
.tmrow .pts.clk{cursor:pointer;border-bottom:1px dotted #48586A}
.tmrow .pts.clk:hover{color:var(--k-y);border-bottom-color:var(--k-y)}
.tmrow .proj{font:500 11.5px var(--mono);color:#5C6874;font-variant-numeric:tabular-nums}
.tmrow.on{background:color-mix(in srgb,var(--k-me) 10%,transparent);border-radius:4px}
@media (max-width:1000px){.prof{grid-template-columns:1fr}.plist .pl{height:320px}}
</style>
