<style>
/* ---------- scheda giocatore (si apre da qualunque nome cliccabile) */
[data-pid]{cursor:pointer}
[data-pid]:hover{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.pm-back{position:fixed;inset:0;z-index:90;background:rgb(4 7 11/.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.pm{--k-bg:#0A0E13;--k-p:#10161E;--k-p2:#151D27;--k-line:#212B37;--k-ink:#E8EDF2;--k-muted:#8593A2;--k-y:#F2D82E;--k-me:#3CC7F5;--live:#2FD27A;--delayed:#F5A524;--offline:#F0524A;
  --QB:#F47272;--RB:#34D399;--WR:#5FA3F8;--TE:#F4A63B;--K:#BFA8FB;--DST:#9AA8BA;
  width:min(980px,100%);background:var(--k-bg);color:var(--k-ink);border:1px solid #232D3A;border-radius:14px;box-shadow:0 24px 60px rgb(0 0 0/.6);font-size:13.5px;line-height:1.45;position:relative}
.pm .x{position:absolute;top:10px;right:12px;background:var(--k-p2);border:1px solid var(--k-line);color:var(--k-ink);border-radius:8px;padding:5px 10px;cursor:pointer;font:600 13px var(--sans)}
.pm-hd{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;padding:18px 18px 14px;border-bottom:1px solid var(--k-line)}
.pm-shot{width:92px;height:67px;object-fit:cover;object-position:top center;border-radius:10px;background:#151D27;flex:none}
.pm-logo{height:22px;width:auto;vertical-align:-3px;margin-left:10px;opacity:.9}
.pm-hd h2{margin:0;font:700 34px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.pm-hd .sub{font-size:12.5px;color:var(--k-muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pm-big{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.pm-big div{text-align:right}
.pm-big b{display:block;font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.pm-big small{font:10.5px var(--mono);letter-spacing:.05em;color:var(--k-muted);text-transform:uppercase}
.pm-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
.pm-col{padding:14px 18px 18px;min-width:0}
.pm-col+.pm-col{border-left:1px solid var(--k-line)}
.pm h4{margin:14px 0 6px;font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--k-muted)}
.pm h4:first-child{margin-top:0}
.pm .row{display:grid;grid-template-columns:140px 1fr 62px;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.pm .row .l{color:var(--k-muted)}
.pm .row .t{height:8px;background:var(--k-p2);border-radius:4px;overflow:hidden;position:relative}
.pm .row .t i{display:block;height:100%;border-radius:4px}
.pm .row .t u{position:absolute;top:-2px;width:2px;height:12px;background:var(--k-muted);text-decoration:none}
.pm .row .v{text-align:right;font:600 12px var(--mono);font-variant-numeric:tabular-nums}
.pm .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--k-line);border-radius:8px;overflow:hidden;margin-bottom:6px}
.pm .grid4 div{background:var(--k-p);padding:7px 10px}
.pm .grid4 small{display:block;font:10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--k-muted)}
.pm .grid4 b{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.pm-wk{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.pm-wk th{font:600 9.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--k-muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--k-line);white-space:nowrap}
.pm-wk th:nth-child(2){text-align:left}
.pm-wk td{padding:4px 6px;text-align:right;border-bottom:1px solid #18202A;white-space:nowrap}
.pm-wk td:nth-child(2){text-align:left;color:var(--k-muted)}
.pm-full{border-top:1px solid var(--k-line);padding:14px 18px 18px}
.pm-full .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px;font-size:11.5px;color:var(--k-muted)}
.pm-full .bar label{display:flex;gap:5px;align-items:center;cursor:pointer}
.pm-st{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;width:100%}
.pm-st th{font:600 9.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--k-muted);text-align:right;padding:4px 7px;border-bottom:1px solid var(--k-line);white-space:nowrap;position:sticky;top:0;background:var(--k-p)}
.pm-st th:first-child,.pm-st td:first-child{text-align:left;position:sticky;left:0;background:var(--k-p);z-index:1}
.pm-st td{padding:3px 7px;text-align:right;border-bottom:1px solid #18202A;white-space:nowrap}
.pm-st tr.grp td{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--k-y);padding-top:10px;border-bottom:1px solid var(--k-line)}
.pm-st td.season{font-weight:700;border-left:1px solid var(--k-line)}
.pm-st td.na{color:#3E4A57}
.src{display:inline-block;min-width:14px;text-align:center;font:700 8.5px/1.5 var(--mono);border-radius:3px;margin-left:4px;padding:0 2px;vertical-align:1px}
.src-E{background:#7A1E1E;color:#FFD9D9}.src-S{background:#123F63;color:#D6ECFF}.src-N{background:#2F3D18;color:#E2F2C4}
.pm-st td.season .src{opacity:.95}
.pm-wk tr.tot td{border-bottom:0;color:var(--k-muted)}
.pm .sched{display:flex;gap:4px;flex-wrap:wrap}
.pm .sched span{font:600 11px var(--mono);border-radius:5px;padding:4px 7px;background:var(--k-p2);color:var(--k-muted)}
.pm .sched span b{color:var(--k-ink);font-weight:700}
.pm ul{margin:4px 0 0;padding-left:16px}
.pm li{font-size:12.5px;margin:3px 0}
.pm .note{font-size:11.5px;color:var(--k-muted);margin-top:8px}
.pm svg{display:block;width:100%;height:auto;overflow:visible}
@media (max-width:820px){.pm-body{grid-template-columns:1fr}.pm-col+.pm-col{border-left:0;border-top:1px solid var(--k-line)}}
</style>
<script>
(()=>{
'use strict';
const D=window.DWR,A=window.DWR2,M=window.DWR3;
const {TBY,MY,esc,PBY,BASE}=D;const {n0,n1,sv,POSC}=A;
/* VORP e tier vivono nel pool della draft: se il giocatore c'è, si riusano */
const ext=p=>PBY.get(p.id)||null;
const vorpOf=p=>{const e=ext(p);return e&&e.vorp!=null?e.vorp:Math.round(p.proj-(BASE[p.pos]||0))};
const tierOf=p=>{const e=ext(p);return e&&e.tier?e.tier:null};
const {POOL,adv,injOf,tm,teamRank,sos3,matchup,WEEK}=M;
const TOP=window.TOPINA;
const IMG=__IMAGES__;
/* tabellino per giornata: [settimana, punti, avversario, tgt, rec, recYd, recTD,
   corse, rushYd, rushTD, passYd, passTD, int, snap, quota target, rz tgt, rz corse, dentro le 10] */
const WEEKLY=()=>window.TOPINA.weekly||{};
const ESPN_SHOT=id=>`https://a.espncdn.com/combiner/i?img=/i/headshots/nfl/players/full/${id}.png&w=240&h=175&scale=crop`;
const shotSrc=p=>IMG.players[String(p.id)]||`img/players/${p.id}.webp`;
const logoSrc=t=>IMG.teams[t]||`img/teams/${t}.webp`;
const BY=new Map(POOL.map(p=>[p.id,p]));
const GS=window.TOPINA.map||{};
const pct=v=>v==null?'—':n1(v)+'%';
const f2=v=>v==null?'—':v.toFixed(2);
const MEDS={};
['QB','RB','WR','TE','K','DST'].forEach(pos=>{
  const l=POOL.filter(p=>p.pos===pos).sort((a,b)=>b.proj-a.proj).slice(0,24);
  const med=k=>{const v=l.map(p=>p[k]).filter(x=>x!=null&&x>0).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:0};
  MEDS[pos]={proj:med('proj'),ppg26:med('ppg26'),ppg25:med('ppg25'),tsh26:med('tsh26'),car26:med('car26'),snap26:med('snap26'),max:l[0]?l[0].proj:1};
});
const row=(l,v,max,unit,med,col)=>{
  const w=max?Math.max(0,Math.min(100,(v||0)/max*100)):0,m=max&&med?Math.min(100,med/max*100):null;
  return`<div class="row"><span class="l">${l}</span><span class="t"><i style="width:${w}%;background:${col||'var(--k-me)'}"></i>${m!=null?`<u style="left:${m}%" title="mediana del reparto"></u>`:''}</span><span class="v">${v==null?'—':n1(v)}${unit||''}</span></div>`;
};
/* andamento partita per partita: 2025 in grigio, 2026 in colore */
function gameLog(p){
  const a26=adv(p,26),a25=adv(p,25);
  const w25=(a25&&a25.wk)||[],w26=(a26&&a26.wk)||[];
  const all=[...w25.map(v=>({v,y:25})),...w26.map(v=>({v,y:26}))].filter(x=>x.v!=null);
  if(!all.length)return'<p class="note">Nessun tabellino disponibile per questo giocatore.</p>';
  const W=420,H=140,L=26,R=6,T=10,B=18,max=Math.max(...all.map(x=>x.v),10);
  const bw=(W-L-R)/all.length;
  let g='';
  [0,max/2,max].forEach(v=>{g+=`<line x1="${L}" y1="${H-B-v/max*(H-B-T)}" x2="${W-R}" y2="${H-B-v/max*(H-B-T)}" stroke="#1E2833"/>`+
    `<text x="${L-5}" y="${H-B-v/max*(H-B-T)+3}" fill="#7C8996" font-size="8.5" text-anchor="end">${n0(v)}</text>`});
  all.forEach((x,i)=>{
    const h=x.v/max*(H-B-T),y=H-B-h;
    g+=`<rect x="${(L+i*bw+1).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2,bw-2).toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="${x.y===26?POSC[p.pos]:'#2C3947'}"><title>${x.y===26?'2026':'2025'} · gara ${i+1-(x.y===26?w25.length:0)}: ${n1(x.v)} punti</title></rect>`;
  });
  const cut=w25.length;
  if(w26.length)g+=`<line x1="${(L+cut*bw).toFixed(1)}" y1="${T-4}" x2="${(L+cut*bw).toFixed(1)}" y2="${H-B}" stroke="#4A5866" stroke-dasharray="3 3"/>`+
    `<text x="${(L+cut*bw+4).toFixed(1)}" y="${T+2}" fill="#7C8996" font-size="8.5">2026</text>`;
  const avg=all.reduce((s,x)=>s+x.v,0)/all.length;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Punti per partita">${g}</svg>
    <p class="note">${w25.length} gare 2025 in grigio, ${w26.length} del 2026 in colore. Media complessiva ${n1(avg)} punti; la costanza conta quanto la media, perché una settimana da 30 non recupera tre da 4.</p>`;
}
function scheduleStrip(p){
  const out=[];
  for(let w=WEEK;w<WEEK+6;w++){
    if(p.bye===w){out.push(`<span style="color:var(--delayed)">S${w} bye</span>`);continue}
    const m=matchup(p,w);if(!m)continue;
    const col=m.f>=1.08?'var(--live)':m.f<=0.92?'var(--offline)':'var(--k-muted)';
    out.push(`<span>S${w} <b style="color:${col}">${esc(m.opp)}</b> ${f2(m.f)}</span>`);
  }
  return out.join('')||'<span>Calendario non disponibile</span>';
}
function verdict(p){
  const a=adv(p,26)||adv(p,25),T=tm(p),ij=injOf(p),up=[],risk=[];
  if(a){
    if(a.targetShare>=.24)up.push(`Prende il ${n0(a.targetShare*100)}% dei target: volume da titolare vero.`);
    if(a.rushShare>=.6)up.push(`Gestisce il ${n0(a.rushShare*100)}% delle corse della squadra.`);
    if(a.wopr>=.6)up.push(`WOPR ${f2(a.wopr)}: target e air yards concentrati su di lui.`);
    if(a.snapPct!=null&&a.snapPct<.55)risk.push(`Solo il ${n0(a.snapPct*100)}% degli snap: ruolo a rotazione.`);
    if(a.sep!=null&&a.sep>=3)up.push(`Si libera bene dalla marcatura (${f2(a.sep)} yard di separazione).`);
    if(a.ryoePerAtt!=null&&a.ryoePerAtt>0.3)up.push(`Corre meglio di quanto dicano i blocchi (RYOE ${f2(a.ryoePerAtt)} per portata).`);
    if(a.epaPerGame!=null&&a.epaPerGame<-1)risk.push('EPA per gara negativa: finora ha tolto più di quanto abbia dato alla sua squadra.');
  }
  if(T){
    if(T.oRank<=8)up.push(`Attacco ${T.oRank}° per punti segnati (${T.ppg} a gara, ${n1(T.td)} TD).`);
    if(T.oRank>=25)risk.push(`Attacco ${T.oRank}°: pochi punti da spartire.`);
  }
  const qb=POOL.filter(x=>x.nfl===p.nfl&&x.pos==='QB').sort((x,y)=>y.proj-x.proj)[0];
  if(['WR','TE','RB'].includes(p.pos)&&qb&&['O','IR','D'].includes(qb.inj))risk.push(`Il QB titolare (${esc(qb.name)}) è ${qb.inj}.`);
  if(ij&&ij.s)risk.push(`Bollettino settimana ${ij.w}: ${ij.s}${ij.i?' ('+esc(ij.i)+')':''}.`);
  else if(ij&&/Limited|Did Not/i.test(ij.pr||''))risk.push(`Allenamento ${/Did Not/i.test(ij.pr)?'saltato':'ridotto'}${ij.i?' per '+esc(ij.i):''} nella settimana ${ij.w}.`);
  const s=sos3(p);
  if(s!=null&&s>=1.08)up.push(`Calendario morbido nelle prossime tre (${f2(s)}).`);
  if(s!=null&&s<=0.92)risk.push(`Calendario duro nelle prossime tre (${f2(s)}).`);
  if(p.age&&p.pos==='RB'&&p.age>=28)risk.push(`${p.age} anni: per un RB è l'età in cui il rendimento cala.`);
  if(p.exp===0)up.push('Rookie: nessuno storico, ma nemmeno un declino da temere.');
  return{up,risk}
}
function weeklyTable(p){
  const rows=(WEEKLY()[String(p.id)]||[]);
  if(!rows.length)return'<p class="note">Nessuna giornata giocata quest\'anno.</p>';
  const isRec=['WR','TE'].includes(p.pos),isRB=p.pos==='RB',isQB=p.pos==='QB';
  const num=v=>v==null?'—':(Math.round(v*10)/10);
  const head=['S','Avv.','Punti']
    .concat(isQB?['Yd pass','TD','INT','Corse','Yd corsa']:[])
    .concat(!isQB?['Tgt','Ric','Yd','TD']:[])
    .concat(isRB||(!isQB&&!isRec)?['Corse','Yd','TD']:[])
    .concat(['Snap','Tgt%','RZ tgt','RZ corse']);
  const cell=r=>['<b>'+r[0]+'</b>',esc(r[2]||'—'),`<b style="color:var(--k-y)">${num(r[1])}</b>`]
    .concat(isQB?[num(r[10]),num(r[11]),num(r[12]),num(r[7]),num(r[8])]:[])
    .concat(!isQB?[num(r[3]),num(r[4]),num(r[5]),num(r[6])]:[])
    .concat(isRB||(!isQB&&!isRec)?[num(r[7]),num(r[8]),num(r[9])]:[])
    .concat([r[13]==null?'—':Math.round(r[13])+'%',r[14]?num(r[14])+'%':'—',num(r[15]),num(r[16])]);
  const tot=rows.reduce((a,r)=>a+(r[1]||0),0);
  return`<div style="overflow-x:auto"><table class="pm-wk">
    <thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cell(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
    <tr class="tot"><td colspan="2">Totale</td><td><b>${num(tot)}</b></td><td colspan="${head.length-3}"></td></tr></tbody></table></div>
    <p class="note">RZ = dentro le 20 yard avversarie: sono le occasioni che valgono touchdown, e spiegano perché un giocatore da pochi metri può valere più di uno da tante yard. Ogni numero viene da ESPN quando c'è, altrimenti da Sleeper (red zone, snap) o da nflverse (quota target): il dettaglio con la fonte è in fondo alla scheda.</p>`;
}
/* tutte le statistiche della stagione: ESPN prima, poi Sleeper, poi nflverse */
const SRCNAME={E:'ESPN',S:'Sleeper',N:'nflverse'};
const PCT=new Set(['tgtShare','airShare','snapPct']);
const GROUPS_FOR={QB:['Fantasy','Passaggi','Corse','Utilizzo','Palla persa e ritorni','Next Gen Stats'],
  RB:['Fantasy','Corse','Ricezioni','Utilizzo','Palla persa e ritorni','Next Gen Stats'],
  WR:['Fantasy','Ricezioni','Corse','Utilizzo','Palla persa e ritorni','Next Gen Stats'],
  TE:['Fantasy','Ricezioni','Corse','Utilizzo','Palla persa e ritorni','Next Gen Stats'],
  K:['Fantasy','Kicker'],DST:['Fantasy','Difesa']};
let FULL_ALL=false;
function fullStats(p){
  const S=window.TOPINA.stats||{},F=S.fields||[],P=(S.players||{})[String(p.id)];
  if(!P)return'<p class="note">Nessuna statistica della stagione in corso per questo giocatore.</p>';
  const weeks=Object.keys(P.w).map(Number).sort((a,b)=>a-b);
  const ssrc=P.seasonSrc.split('|');
  const fmt=(k,t,v)=>{
    if(v==null)return null;
    if(PCT.has(k))return(Math.round(v*1000)/10)+'%';
    return Number.isInteger(v)?String(v):String(Math.round(v*100)/100);
  };
  const want=new Set(GROUPS_FOR[p.pos]||GROUPS_FOR.WR);
  let out='',grp=null,shown=0,hidden=0;
  F.forEach(([k,label,g,t],i)=>{
    const vals=weeks.map(w=>P.w[String(w)].v[i]);
    const any=vals.some(v=>v!=null&&v!==0)||(P.season[i]!=null&&P.season[i]!==0);
    if(!FULL_ALL&&(!want.has(g)||!any)){if(vals.some(v=>v!=null))hidden++;return}
    if(g!==grp){grp=g;out+=`<tr class="grp"><td colspan="${weeks.length+3}">${esc(g)}</td></tr>`}
    shown++;
    const cell=(v,src,cls)=>{const f=fmt(k,t,v);
      return f==null?`<td class="na${cls?' '+cls:''}">—</td>`
        :`<td${cls?` class="${cls}"`:''} title="${src.split('').map(c=>SRCNAME[c]||'').filter(Boolean).join(' + ')}">${f}${src.split('').filter(c=>SRCNAME[c]).map(c=>`<span class="src src-${c}">${c}</span>`).join('')}</td>`};
    const kind=t==='sum'?'totale':t==='max'?'massimo':'stagione';
    out+=`<tr><td>${esc(label)}</td>${weeks.map((w,j)=>cell(vals[j],P.w[String(w)].s[i])).join('')}
      ${cell(P.season[i],ssrc[i]==='-'?'':ssrc[i],'season')}<td style="color:var(--k-muted);text-align:left;font-size:10px">${kind}</td></tr>`;
  });
  return`<div class="bar"><span>${P.gp} partite giocate · ${shown} statistiche mostrate${hidden&&!FULL_ALL?` · ${hidden} nascoste perché a zero o di altri ruoli`:''}</span>
      <label><input type="checkbox" data-full-all ${FULL_ALL?'checked':''}> mostra tutti i campi</label>
      <span style="margin-left:auto">fonte: <span class="src src-E">E</span> ESPN · <span class="src src-S">S</span> Sleeper · <span class="src src-N">N</span> nflverse</span></div>
    <div style="overflow:auto;max-height:520px"><table class="pm-st">
      <thead><tr><th>Statistica</th>${weeks.map(w=>`<th>S${w}</th>`).join('')}<th>Stagione</th><th></th></tr></thead>
      <tbody>${out}</tbody></table></div>
    <p class="note">Ogni numero prende ESPN quando ESPN lo fornisce, altrimenti Sleeper, altrimenti nflverse; la lettera accanto dice da dove arriva. I totali di stagione sommano le giornate giocate; quota target, WOPR, RACR, CPOE e Next Gen Stats sono i valori di stagione calcolati da nflverse; passer rating e quota snap sono ricalcolati dai totali.</p>`;
}
function html(p){
  const a26=adv(p,26),a25=adv(p,25),T=tm(p),med=MEDS[p.pos],ij=injOf(p);
  const own=p.own?TBY.get(p.own):null;
  const posRank=POOL.filter(x=>x.pos===p.pos&&x.proj>p.proj).length+1;
  const v=verdict(p);
  const A=k=>(a26&&a26[k]!=null?a26[k]:(a25&&a25[k]!=null?a25[k]:null));
  return`<div class="pm" role="dialog" aria-modal="true" aria-label="Scheda di ${esc(p.name)}">
  <button class="x" aria-label="Chiudi">✕ Chiudi</button>
  <div class="pm-hd">
    <img class="pm-shot" src="${shotSrc(p)}" data-fallback="${ESPN_SHOT(p.id)}" alt="">
    <div><h2>${esc(p.name)}${p.nfl&&p.nfl!=='FA'?`<img class="pm-logo" src="${logoSrc(p.nfl)}" alt="${esc(p.nfl)}">`:''}</h2>
      <div class="sub"><span class="pos pos-${p.pos}" style="display:inline-block;min-width:32px;text-align:center;font:700 10.5px/1 var(--mono);padding:3px 4px;border-radius:4px;color:#0B0F14;background:${POSC[p.pos]}">${p.pos}</span>
        <span>${p.pos}${posRank} · ${p.nfl}${T?` · attacco ${T.oRank}°`:''}</span>
        <span>${p.bye?'bye '+p.bye:'bye n/d'}</span>
        <span>${p.age?p.age+' anni':''}${p.exp!=null?' · '+p.exp+' stagioni':''}</span>
        ${p.inj?`<span style="color:var(--offline)">${p.inj}${ij&&ij.i?' · '+esc(ij.i):''}</span>`:''}
        <span>${own?`in rosa a ${esc(own.name)}`:'libero nella lega'}</span>
        ${p.pct!=null?`<span>posseduto nel ${n0(p.pct)}% delle leghe ESPN</span>`:''}</div></div>
    <div class="pm-big">
      <div><b style="color:var(--k-y)">${n0(p.proj)}</b><small>proiezione 2026</small></div>
      <div><b>${n1(p.proj/17)}</b><small>attesi a gara</small></div>
      <div><b style="color:${(p.ppg26||0)>=p.proj/17?'var(--live)':'var(--offline)'}">${p.ppg26!=null?n1(p.ppg26):'—'}</b><small>reali 2026</small></div>
      <div><b>${sv(vorpOf(p))}</b><small>VORP lega</small></div>
    </div>
  </div>
  <div class="pm-body">
    <div class="pm-col">
      <h4>Partita per partita</h4>
      ${gameLog(p)}
      <h4>Giornata per giornata</h4>
      ${weeklyTable(p)}
      <h4>Volume e ruolo</h4>
      ${row('Proiezione 2026',p.proj,med.max,' pt',med.proj,POSC[p.pos])}
      ${row('Punti a gara 2026',p.ppg26,Math.max(med.max/17*1.6,1),'',med.ppg26)}
      ${row('Punti a gara 2025',p.ppg25,Math.max(med.max/17*1.6,1),'',med.ppg25)}
      ${['WR','TE'].includes(p.pos)||A('targetShare')>0.08?row('Target share',A('targetShare')!=null?A('targetShare')*100:null,35,'%',med.tsh26):''}
      ${p.pos==='RB'||A('rushShare')>0.05?row('Quota corse',A('rushShare')!=null?A('rushShare')*100:null,100,'%',null):''}
      ${row('Snap',A('snapPct')!=null?A('snapPct')*100:p.snap26,100,'%',med.snap26)}
      ${A('wopr')!=null?row('WOPR',A('wopr'),1,'',null):''}
      ${(()=>{const K=(window.TOPINA.kickers||{}).cur||{},DEF=(window.TOPINA.defense||{}).cur||{},g=GS[String(p.id)];
        if(p.pos==='K'&&g&&K[g]){const k=K[g];
          return`<h4>Da kicker</h4><div class="grid4">
            <div><small>Field goal</small><b>${k.fgMade}/${k.fgAtt}</b></div>
            <div><small>Percentuale</small><b>${k.fgPct!=null?n0(k.fgPct)+'%':'—'}</b></div>
            <div><small>Dai 40 in su</small><b>${k.from40}</b></div>
            <div><small>Più lungo</small><b>${k.long} yd</b></div>
            <div><small>Extra point</small><b>${k.patMade}/${k.patAtt}</b></div></div>`}
        if(p.pos==='DST'&&DEF[p.nfl]){const d=DEF[p.nfl];
          return`<h4>Da difesa</h4><div class="grid4">
            <div><small>Sack a gara</small><b>${n1(d.sacks)}</b></div>
            <div><small>Intercetti a gara</small><b>${n1(d.int)}</b></div>
            <div><small>Fumble forzati</small><b>${n1(d.ff)}</b></div>
            <div><small>TD difensivi</small><b>${d.td}</b></div></div>`}
        return''})()}
      <h4>Numeri avanzati</h4>
      <div class="grid4">
        ${[['Target/gara',A('tgtPerGame')],['Corse/gara',A('carriesPerGame')],['Yd per target',A('ydsPerTgt')],['Yd per corsa',A('ydsPerCarry')],
           ['Separazione',A('sep')],['YAC oltre atteso',A('yacOE')],['RYOE/att',A('ryoePerAtt')],['EPA/gara',A('epaPerGame')],
           ['CPOE',A('cpoe')],['Tempo di lancio',A('timeToThrow')],
           ['Snap special team',A('stPct')!=null?A('stPct')*100:null]].filter(x=>x[1]!=null)
          .map(([l,val])=>`<div><small>${l}</small><b>${n1(val)}</b></div>`).join('')||'<div><small>Dati avanzati</small><b>—</b></div>'}
      </div>
      <p class="note">Tabellini e utilizzo 2026 prendono ESPN quando c'è, poi Sleeper (snap, red zone, drop), poi nflverse (quota target, WOPR, EPA, Next Gen Stats): la fonte di ogni numero è nella tabella in fondo. Proiezione e stato fisico da ESPN nello scoring della tua lega. Tutto scaricato e ricalcolato dalla pipeline di questo progetto.</p>
    </div>
    <div class="pm-col">
      <h4>Contesto squadra</h4>
      <div class="grid4">
        <div><small>Punti/gara</small><b>${T?T.ppg:'—'}</b></div>
        <div><small>Rank attacco</small><b>${T?T.oRank+'°':'—'}</b></div>
        <div><small>Passa</small><b>${T?n0(T.pass*100)+'%':'—'}</b></div>
        <div><small>TD a gara</small><b>${T?n1(T.td):'—'}</b></div>
      </div>
      <h4>La partita</h4>
      ${(()=>{const G=(window.TOPINA.games||{})[p.nfl]||{};
        // a partita iniziata ESPN toglie le quote: in quel caso mostro la prossima
        const keys=Object.keys(G).sort((a,b)=>a-b);
        const g=G[String(WEEK)]&&G[String(WEEK)].total!=null?G[String(WEEK)]
               :(keys.map(k=>G[k]).find(x=>x&&x.total!=null)||G[String(WEEK)]||G[keys[0]]);
        if(!g)return '<p class="note">Nessuna partita in programma nelle prossime giornate.</p>';
        const wkOf=keys.find(k=>G[k]===g);
        const when=(g.kick||'').slice(0,16).replace('T',' ');
        return`<div class="grid4">
          <div><small>Avversario ${wkOf&&+wkOf!==WEEK?`(S${wkOf})`:''}</small><b>${g.home?'':'@'}${esc(g.opp||'—')}</b></div>
          <div><small>Totale Vegas</small><b>${g.total??'—'}</b></div>
          <div><small>Spread</small><b>${g.spread==null?'—':(g.spread>0?'+':'')+g.spread}</b></div>
          <div><small>Punti attesi squadra</small><b style="color:${g.implied>=26?'var(--live)':g.implied<=18?'var(--offline)':'var(--k-ink)'}">${g.implied??'—'}</b></div>
        </div>
        <p class="note">${esc(g.venue||'')}${g.indoor?' · al chiuso':''}${g.temp!=null?` · ${g.temp}°F`:''}${g.sky&&!/^\d+$/.test(String(g.sky))?' '+esc(String(g.sky)):''}${when?` · ${esc(when)} UTC`:''}. Il totale implicito è quanto il mercato si aspetta che segni la sua squadra: sopra 26 è un contesto da punti, sotto 18 è una partita chiusa.</p>`})()}
      <h4>Proiezione ESPN per giornata</h4>
      ${(()=>{const r=(window.TOPINA.projWeeks||{})[String(p.id)];
        if(!r)return '<p class="note">Nessuna proiezione ufficiale per le prossime giornate.</p>';
        const ks=Object.keys(r).sort((a,b)=>a-b);
        const mx=Math.max(...ks.map(k=>r[k]),1);
        return`<div class="sched">${ks.map(k=>`<span>S${k} <b style="color:${r[k]>=mx*0.95?'var(--live)':'var(--k-ink)'}">${n1(r[k])}</b></span>`).join('')}</div>`})()}
      <h4>Prossime giornate</h4>
      <div class="sched">${scheduleStrip(p)}</div>
      <p class="note">Il numero è quanto quella difesa concede al suo reparto rispetto alla media: sopra 1 è favorevole, sotto è dura.</p>
      <h4>Mercato</h4>
      <div class="grid4">
        <div><small>ADP</small><b>${p.adp||'—'}</b></div>
        <div><small>Rank ESPN</small><b>${p.rank<900?p.rank:'—'}</b></div>
        <div><small>Tier</small><b>${tierOf(p)||'—'}</b></div>
        <div><small>Posseduto</small><b>${p.pct!=null?n0(p.pct)+'%':'—'}</b></div>
        <div><small>Schierato</small><b>${p.started!=null?n0(p.started)+'%':'—'}</b></div>
        <div><small>Presi 24h</small><b>${(()=>{const t=(window.TOPINA.trending||{})[p.id];return t&&t.add?(t.add>=1000?Math.round(t.add/1000)+'k':t.add):'—'})()}</b></div>
      </div>
      <h4>Perché potrebbe rendere</h4>
      <ul>${v.up.length?v.up.map(t=>`<li>${t}</li>`).join(''):'<li style="color:var(--k-muted)">Nessun segnale forte nei dati disponibili.</li>'}</ul>
      ${(()=>{const F=(window.TOPINA.frailty||{})[GS[String(p.id)]||''];
        if(!F||!F.weeks)return'';
        const idx=Math.round((F.out*2+F.dnp*1.5+F.limited)/Math.max(1,F.weeks)*100);
        const lab=idx>=120?'alta':idx>=60?'media':'bassa';
        return`<h4>Storia fisica</h4><div class="grid4">
          <div><small>Fragilità</small><b style="color:${idx>=120?'var(--offline)':idx>=60?'var(--delayed)':'var(--live)'}">${lab}</b></div>
          <div><small>Settimane fuori</small><b>${F.out}</b></div>
          <div><small>Allenamenti saltati</small><b>${F.dnp}</b></div>
          <div><small>Bollettini</small><b>${F.weeks}</b></div></div>
          ${F.list.length?`<p class="note">Problemi segnalati fra 2025 e 2026: ${F.list.map(esc).join(', ')}.</p>`:''}`})()}
      <h4>Rischi</h4>
      <ul>${v.risk.length?v.risk.map(t=>`<li>${t}</li>`).join(''):'<li style="color:var(--k-muted)">Nessun rischio evidente.</li>'}</ul>
    </div>
  </div>
  <div class="pm-full"><h4>Tutte le statistiche della stagione</h4><div data-full="${p.id}">${fullStats(p)}</div></div></div>`;
}
let back=null;
function close(){if(back){back.remove();back=null;document.removeEventListener('keydown',onKey)}}
function onKey(e){if(e.key==='Escape')close()}
window.openPlayer=function(id){
  const p=BY.get(+id);if(!p)return;
  close();
  back=document.createElement('div');back.className='pm-back';back.innerHTML=html(p);
  // se la foto non c'è si prova ESPN, e se nemmeno quella risponde sparisce
  back.querySelectorAll('img[data-fallback]').forEach(im=>{
    im.addEventListener('error',()=>{
      if(im.dataset.fallback&&im.src!==im.dataset.fallback){im.src=im.dataset.fallback;im.removeAttribute('data-fallback')}
      else im.remove();
    });
  });
  back.querySelectorAll('.pm-logo').forEach(im=>im.addEventListener('error',()=>im.remove()));
  back.addEventListener('click',e=>{if(e.target===back||e.target.closest('.x'))close()});
  back.addEventListener('change',e=>{
    if(!e.target.matches('[data-full-all]'))return;
    FULL_ALL=e.target.checked;
    const box=back.querySelector('[data-full]');box.innerHTML=fullStats(p);
  });
  document.body.appendChild(back);document.addEventListener('keydown',onKey);
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-pid]');
  if(!el||e.target.closest('button,select,input,a'))return;
  e.preventDefault();window.openPlayer(el.dataset.pid);
});
})();
</script>
